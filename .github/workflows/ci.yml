# Tests on every pull request and on main. The deploy workflow runs the same tests before going live.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests 2>&1 | tee test-output.txt
      - name: Show failures as annotations
        if: failure()
        run: python .github/scripts/annotate_failures.py test-output.txt

{% extends "tg_base.html" %}
{% block title %}Set up Thanksgiving{% endblock %}
{% block body %}
<main style="max-width: 34rem; margin: 3rem auto; padding: 0 1rem;">
  <div class="card stack">
    <h1>Thanksgiving planner</h1>
    <p class="muted">Set dinner time and who's cooking. Every step is scheduled backward from dinner.</p>
    <form method="post" action="/thanksgiving/setup" class="stack">
      <div class="row">
        <div class="field"><label for="d">Dinner date</label>
          <input type="date" id="d" name="dinner_date" value="{{ default_date }}" required></div>
        <div class="field"><label for="t">Dinner time</label>
          <input type="time" id="t" name="dinner_time" value="{{ default_time }}" required></div>
      </div>
      <div class="field"><label for="c">Cooks (comma separated)</label>
        <input type="text" id="c" name="cooks" value="{{ default_cooks }}"></div>
      <div class="field"><label for="o">Ovens</label>
        <select id="o" name="ovens"><option value="1">1</option><option value="2">2</option></select></div>
      <label class="row" style="font-weight:500"><input type="checkbox" name="starter_menu" value="1" checked>
        Start with our menu: turkey on vegetables, whipped potatoes, gravy, stuffing, sourdough, pumpkin pie, and house prep</label>
      <button class="primary" type="submit">Create the plan</button>
    </form>
  </div>
</main>
{% endblock %}
{% block feedback %}{% endblock %}
